<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星 Star - v0.1 SS 原型</title>
<script src="break_eternity.js" onerror="alert('break_eternity.js 加载失败，请检查路径')"></script>
<style>
  /* ===== 本地字体 ===== */
  @font-face {
    font-family: 'Orbitron';
    src: url('fonts/Orbitron-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Orbitron';
    src: url('fonts/Orbitron-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Aldrich';
    src: url('fonts/Aldrich-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'MiSans';
    src: url('fonts/MiSans-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'MiSans';
    src: url('fonts/MiSans-Bold.woff2') format('woff2');
    font-weight: 700;
  }

  * { box-sizing: border-box; }

  body {
    background: #111118;
    color: #d8d8e8;
    font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 16px;
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
  }

  h1 {
    font-family: 'Orbitron', 'MiSans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 14px 0;
    color: #e8e8ff;
    letter-spacing: 1px;
  }

  h1 small {
    font-family: 'Aldrich', 'MiSans', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: #7a7a9a;
    margin-left: 8px;
    letter-spacing: 0.5px;
  }

  h2 {
    font-family: 'Aldrich', 'MiSans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    margin: 20px 0 8px 0;
    color: #9cb8ff;
    letter-spacing: 1px;
    border-bottom: 1px solid #2a2a3a;
    padding-bottom: 4px;
  }

  .stat { margin: 3px 0; color: #a8a8c0; }

  #sp, #sps, #sf, #as-count, #speed, #ring-cap {
    font-family: 'Orbitron', 'MiSans', sans-serif;
    font-weight: 600;
    color: #e0e0ff;
    letter-spacing: 0.5px;
  }

  .sl {
    background: #16161e;
    border: 1px solid #2a2a3a;
    padding: 6px 10px;
    margin: 3px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: nowrap;
    gap: 6px;
    border-radius: 2px;
  }

  .sl:hover { border-color: #3a3a5a; background: #1a1a24; }

  .sl span {
    font-size: 12px;
    min-width: 0;
    flex-shrink: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sl span:first-child {
    font-family: 'Aldrich', 'MiSans', sans-serif;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .sl span:not(:first-child) {
    font-family: 'Orbitron', 'MiSans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3px;
  }

  .sl button {
    flex-shrink: 0;
    margin-left: auto;
  }

  button {
    font-family: 'Aldrich', 'MiSans', sans-serif;
    background: #1c1c28;
    color: #c8c8e0;
    border: 1px solid #33334a;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    font-size: 12px;
    letter-spacing: 0.5px;
    transition: background 0.1s, border-color 0.1s;
  }

  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:not(:disabled):hover { background: #2a2a40; border-color: #5a5a8a; color: #e8e8ff; }
  button:not(:disabled):active { background: #3a3a58; }

  .upgrades { display: flex; flex-wrap: wrap; gap: 6px; }

  #buy-all-sl { margin-top: 8px; border-color: #4a4a6a; color: #b8b8e0; }
  #buy-all-sl:hover { background: #2a2a40; border-color: #6a6aaa; }

  .save-btns { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: #5a5a7a;
    text-align: center;
  }
</style>
</head>
<body>

<h1>星 Star <small>v0.1 SS 原型</small></h1>

<div>
  <p class="stat">SP: <span id="sp">10</span></p>
  <p class="stat">SP/s: <span id="sps">0</span></p>
  <p class="stat">SF: <span id="sf">0</span></p>
  <p class="stat">AS 次数: <span id="as-count">0</span></p>
  <p class="stat">转速: <span id="speed">0.5</span> 圈/s</p>
  <p class="stat">圈数上限: <span id="ring-cap">100</span></p>
</div>

<div id="sl-list"></div>
<button id="buy-all-sl">一键购买 SL1~SL10（能买则买）</button>

<h2>转速升级</h2>
<div id="speed-upgrades" class="upgrades"></div>

<h2>AS 星之飞升</h2>
<button id="as-btn" disabled>需要 1e4 SP</button>

<h2>SF 永久升级</h2>
<div id="sf-upgrades" class="upgrades"></div>

<div class="save-btns">
  <button id="save-btn">手动保存</button>
  <button id="export-btn">导出存档</button>
  <button id="import-btn">导入存档</button>
  <button id="reset-btn">重置存档</button>
</div>

<footer>本页面使用了 MiSans 字体。</footer>

<script src="save.js"></script>
<script src="game.js"></script>
</body>
</html>
